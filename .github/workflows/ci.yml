name: cicd

on:
  push:
    branches:
      - main


jobs:
  test-execution:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: execute script scenerio 1
        run: bash greetings.sh

      - name: execute script scenerio 2
        run: bash greetings.sh Gayatri

      - name: execute script scenerio 3
        run: bash greetings.sh --help


  docker-build:
    runs-on: ubuntu-latest
    needs: test-execution

    steps:
      - name: docker tools check
        run: |
             docker --version
             docker compose version

      - name: checkout repo
        uses: actions/checkout@v4

      - name: image build
        run: docker build -t greet:v1 .

      - name: container run
        run: docker run --name greet_container greet:v1
